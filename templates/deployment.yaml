apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-app

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: todo-app

  template:
    metadata:
      labels:
        app: todo-app

    spec:
      containers:
        - name: todo-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 80
              protocol: TCP